apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: revhive

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: krsourav14/auth-service:latest

          ports:
            - containerPort: 8081

          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8761/eureka

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/revhive_db?createDatabaseIfNotExist=true

            - name: SPRING_DATASOURCE_USERNAME
              value: sourav

            - name: SPRING_DATASOURCE_PASSWORD
              value: sourav@123

            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.MySQLDialect

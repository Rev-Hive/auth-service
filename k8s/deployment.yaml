apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: revhive

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: krsourav14/auth-service:latest

          ports:
            - containerPort: 8081

          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-registry:8761/eureka
